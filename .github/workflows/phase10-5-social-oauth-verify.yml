name: Phase 10.5 Social OAuth Verification

on:
  push:
    branches: [feat/phase10-5-social-oauth]
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/annan-social-oauth/**'
      - 'supabase/migrations/20261102100000_phase10_5_social_oauth.sql'
      - 'scripts/annan_growth_client.js'
      - 'scripts/placurso_social_integrations.js'
      - 'scripts/patch_placurso_social_integrations.py'
      - 'scripts/build_netlify.py'
      - 'scripts/test_phase10_5_social_oauth_schema.py'
      - 'scripts/test_phase10_5_social_oauth_build.py'
      - '.github/workflows/phase10-5-social-oauth-verify.yml'

permissions:
  contents: read

jobs:
  social-oauth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check browser module syntax
        run: |
          node --check scripts/annan_growth_client.js
          node --check scripts/placurso_social_integrations.js
      - name: Verify OAuth storage and single-use state contract
        run: python scripts/test_phase10_5_social_oauth_schema.py
      - name: Verify CEO build and social connection controls
        run: python scripts/test_phase10_5_social_oauth_build.py
      - name: Test secure Meta, YouTube and WhatsApp OAuth handler
        run: deno test supabase/functions/annan-social-oauth/index_test.ts
