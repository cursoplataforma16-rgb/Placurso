name: Phase 6 Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/phase6-*']

jobs:
  schema-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify ANNAN Supabase schema contract
        run: python scripts/test_annan_supabase_schema.py
