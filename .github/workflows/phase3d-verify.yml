name: Placurso functional verification

on:
  push:
    branches:
      - main
      - feature/community-functional-flow
      - feature/phase5-annan-engine
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Functional and build checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Placurso
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test crypto progression
        run: node scripts/test_crypto_progression_core.js

      - name: Test ANNAN profile calculations
        run: node scripts/test_annan_profile_core.js

      - name: Test ANNAN learning memory and recommendations
        run: node scripts/test_annan_learning_core.js

      - name: Test community access
        run: node scripts/test_community_access_core.js

      - name: Test seven-question psychotechnical
        run: node scripts/test_psychotechnical_core.js

      - name: Test biblical learning
        run: node scripts/test_bible_learning_core.js

      - name: Compile Python patch scripts
        run: python -m py_compile scripts/*.py

      - name: Verify community composition with Phase 3C and 3D
        run: python scripts/test_community_flow_pipeline.py

      - name: Verify Phase 4 public guard
        run: python scripts/test_phase4_public_guard.py

      - name: Reproduce the exact Netlify build command
        run: python3 scripts/build_netlify.py
