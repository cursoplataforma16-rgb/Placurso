name: Phase 4 guard verification

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  phase4-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Placurso public guard regression
        run: python3 scripts/test_phase4_public_guard.py
      - name: Verify clean Placurso site isolation
        run: python3 scripts/test_placurso_clean_site.py
