name: Phase 10.2 Growth Gateway Verification

on:
  push:
    branches: [feature/phase10-2-audience-growth-engine]
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/annan-growth/**'
      - 'supabase/migrations/*growth_foundation*.sql'
      - 'supabase/migrations/*ceo_google_login_repair.sql'
      - 'supabase/migrations/*ceo_signup_profile_from_identity.sql'
      - 'supabase/migrations/*placurso_ceo_bootstrap_rpc.sql'
      - 'scripts/annan_growth_client.js'
      - 'scripts/placurso-growth-center.js'
      - 'scripts/test_annan_growth_contract.py'
      - 'scripts/test_annan_ceo_auth_contract.py'
      - 'scripts/test_placurso_source_isolation.py'
      - 'scripts/build_placurso_ceo_page.py'
      - 'scripts/test_placurso_isolated_routes.py'
      - 'scripts/test_annan_growth_schema.py'
      - 'scripts/test_phase10_2_build_integration.py'
      - 'scripts/test_ceo_login_build_output.py'
      - 'scripts/audit_placurso_source_bundle.py'
      - 'scripts/build_netlify.py'
      - 'scripts/patch_annan_growth_assets.py'
      - '.github/workflows/phase10-2-growth-gateway-verify.yml'

jobs:
  growth-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify CEO authorization and secret boundary
        run: python scripts/test_annan_growth_contract.py
      - name: Verify Phase 10.3 CEO Google authentication contract
        run: python scripts/test_annan_ceo_auth_contract.py
      - name: Verify Placurso source isolation guard
        run: python scripts/test_placurso_source_isolation.py
      - name: Verify isolated CEO route and safe Netlify redirects
        run: python scripts/test_placurso_isolated_routes.py
      - name: Verify growth schema security contract
        run: python scripts/test_annan_growth_schema.py
      - name: Verify server authentication and approval workflow
        run: deno test --allow-net supabase/functions/annan-growth/index_test.ts
      - name: Verify Growth Center build integration
        run: python scripts/test_phase10_2_build_integration.py
      - name: Build the production Netlify site and verify CEO login assets
        run: |
          python scripts/build_netlify.py
          python scripts/strategic_games_patch.py
          python scripts/strategic_decision_game.py
          python scripts/patch_static_seo_routes.py
          python scripts/test_ceo_login_build_output.py
      - name: Verify the generated CEO page is present
        run: test -s public/ceo.html
      - name: Block DIONUEL and legacy schema from Placurso source and production bundle
        run: python scripts/audit_placurso_source_bundle.py
      - name: Upload extracted source and production output for isolation review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placurso-source-isolation-review
          retention-days: 1
          path: |
            .site-extracted/index.html
            .site-extracted/psico-engine.js
            .site-extracted/netlify/functions/seo.mjs
            public/index.html
            public/psico-engine.js
            public/manifest.json
            public/sw.js
            public/_redirects
      - name: Verify existing ANNAN gateway
        run: node scripts/test_annan_integration_gateway.js
      - name: Verify Phase 8 and Phase 9 integration contracts
        run: |
          python scripts/test_phase8_integration_gateway.py
          node scripts/test_annan_execution_gateway_adapter.js
          python scripts/test_phase9_2_build_integration.py
          python scripts/test_phase9_3_build_integration.py
