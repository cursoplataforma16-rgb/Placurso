<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plataforma Curso</title>
<meta name="theme-color" content="#14284B">
<link rel="icon" href="/curso-icon-192.png" type="image/png">
<style>
:root{--azul:#14284B;--azul2:#2E5AA8;--real:#E2A33B;--texto:#1A2233;--suave:#5B6478;--linha:#E3E7EF;--claro:#F3F5F9;--ok:#1E8E5A;--erro:#C0392B}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--texto);background:var(--claro);font-size:17px;line-height:1.6}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
.topo{background:var(--azul);color:#fff;padding:18px 18px 22px}
.topo small{opacity:.8;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.topo h1{margin:6px 0 6px;font-size:25px;line-height:1.25}
.topo p{margin:0;opacity:.9;font-size:15px}
.topo .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.topo .meta span{background:rgba(255,255,255,.12);border-radius:20px;padding:4px 10px;font-size:13px}
.prog{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--linha);padding:8px 16px}
.prog .b{height:6px;background:var(--claro);border-radius:4px;overflow:hidden}.prog .b i{display:block;height:100%;width:0;background:var(--real);transition:width .3s}
.prog small{font-size:12px;color:var(--suave)}
main{max-width:680px;margin:0 auto;padding:12px 14px 40px}
.promessa{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:14px 16px;margin:12px 0}
.promessa b{display:block;margin-bottom:4px}
.parte{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:16px;margin:14px 0}
.parte>header{display:flex;gap:10px;align-items:baseline}
.parte>header span{font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.parte h2{margin:0;font-size:21px;line-height:1.3}
.parte h3{font-size:17px;margin:18px 0 6px}
.parte p{margin:8px 0}
.parte ul,.parte ol{padding-left:22px;margin:8px 0}
.destaque{border-left:4px solid var(--real);background:#FFF8EC;padding:10px 12px;border-radius:0 10px 10px 0;margin:12px 0;font-size:16px}
.passos{counter-reset:p;list-style:none;padding:0}
.passos li{counter-increment:p;position:relative;padding:8px 0 8px 40px;border-bottom:1px solid var(--linha)}
.passos li:before{content:counter(p);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.ferr{background:var(--claro);border-radius:14px;padding:14px;margin:14px 0}
.ferr>b{display:block;margin-bottom:4px}.ferr>small{display:block;color:var(--suave);font-size:13px;margin-bottom:8px}
.ferr label{display:block;font-size:14px;font-weight:600;margin-top:10px}
.ferr label em{display:block;font-weight:400;font-style:normal;color:var(--suave);font-size:13px}
.ferr textarea,.ferr input{width:100%;margin-top:4px;padding:10px;border:1px solid var(--linha);border-radius:10px;background:#fff;min-height:44px}
.ferr textarea{min-height:70px;resize:vertical}
.saida{background:#fff;border:1px dashed var(--azul2);border-radius:10px;padding:10px;margin-top:10px;white-space:pre-wrap;font-size:15px;min-height:40px}
.bts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bt{background:var(--azul);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;min-height:44px}
.bt2{background:#fff;color:var(--azul);border:1px solid var(--azul);padding:11px 16px;border-radius:12px;font-weight:700;min-height:44px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--linha);font-size:16px}
.chk input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--ok)}
.cartao{background:#fff;border:1px solid var(--linha);border-radius:12px;margin-top:8px}
.cartao summary{padding:12px;font-weight:600;cursor:pointer;list-style:none}
.cartao summary::-webkit-details-marker{display:none}
.cartao summary:after{content:"Ver dica";float:right;font-size:12px;color:var(--azul2);font-weight:600}
.cartao[open] summary:after{content:"Fechar"}
.cartao div{padding:0 12px 12px;color:var(--suave);font-size:15px}
.quiz{border-top:2px solid var(--claro);margin-top:16px;padding-top:12px}
.quiz>b{display:block}.quiz>small{color:var(--suave);font-size:13px}
.qq{margin-top:12px}.qq p{font-weight:600;margin:0 0 6px}
.qq button{display:block;width:100%;text-align:left;padding:11px 12px;margin-top:6px;border-radius:10px;background:var(--claro);border:1px solid var(--linha);color:var(--texto);min-height:44px}
.qq button.certa{background:#E6F4EC;border-color:var(--ok)}.qq button.errada{background:#FBEAEA;border-color:var(--erro)}
.qq .ex{font-size:14px;color:var(--suave);margin-top:6px}
.qres{margin-top:12px;font-weight:700}
.feito{display:none;margin-top:12px;background:#E6F4EC;color:var(--ok);border-radius:10px;padding:10px;font-weight:700;text-align:center}
.parte.ok .feito{display:block}
.fontes{font-size:14px}.fontes li{margin:6px 0}.fontes a{color:var(--azul2);word-break:break-word}
.fim{background:var(--azul);color:#fff;border-radius:16px;padding:18px;margin:18px 0;text-align:center}
.fim h2{margin:0 0 6px;font-size:21px}.fim p{opacity:.9;margin:6px 0 12px}
.fim a,.fim button{display:block;width:100%;margin-top:8px;padding:13px;border-radius:12px;font-weight:700;text-decoration:none;min-height:48px}
.fim .a1{background:var(--real);color:var(--azul)}.fim .a2{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
footer{text-align:center;font-size:13px;color:var(--suave);padding:10px 14px 30px}
footer a{color:var(--azul2)}
@media print{.prog,.fim,.bts,.quiz,footer .np{display:none}.parte{break-inside:avoid;border:0}body{background:#fff}.topo{color:#000;background:#fff;border-bottom:2px solid #000}}
</style>
</head>
<body>
<div class="topo"><small id="tTipo"></small><h1 id="tTitulo"></h1><p id="tSub"></p><div class="meta" id="tMeta"></div></div>
<div class="prog"><div class="b"><i id="pBar"></i></div><small id="pTxt"></small></div>
<main id="conteudo"></main>
<footer>Plataforma Curso · <a href="/">Desafio do dia</a> · <a href="https://wa.me/244958392006">Falar connosco</a> · <a href="#" class="np" onclick="window.print();return false">Imprimir / guardar PDF</a></footer>

<!-- O motor de infoprodutos só escreve este bloco de dados (formato em docs/FORMATO_INFOPRODUTO.md). -->
<script id="dados" type="application/json">{}</script>

<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('dados').textContent || '{}');
var CHAVE = 'pc_guia_' + (D.id || 'x');
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function md(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function ler(){ try{ return JSON.parse(localStorage.getItem(CHAVE) || '{}') || {}; }catch(e){ return {}; } }
function gravar(o){ try{ localStorage.setItem(CHAVE, JSON.stringify(o)); }catch(e){} }
function medir(ev){ try{ if(window.medirEvento) window.medirEvento(ev); }catch(e){} }
var E = ler(); E.campos = E.campos || {}; E.chk = E.chk || {}; E.partes = E.partes || {};

document.title = (D.titulo || 'Guia') + ' · Plataforma Curso';
$('tTipo').textContent = D.tipo || 'Guia prático';
$('tTitulo').textContent = D.titulo || '';
$('tSub').textContent = D.subtitulo || '';
$('tMeta').innerHTML = [(D.minutos ? D.minutos + ' min' : ''), (D.partes ? D.partes.length + ' partes' : ''), 'Funciona sem Internet', 'Para imprimir'].filter(Boolean).map(function(x){ return '<span>' + esc(x) + '</span>'; }).join('');

function bloco(b, pi, bi){
  var id = 'p' + pi + 'b' + bi;
  if(b.tipo === 'texto') return b.paragrafos.map(function(p){ return '<p>' + md(p) + '</p>'; }).join('');
  if(b.tipo === 'subtitulo') return '<h3>' + esc(b.texto) + '</h3>';
  if(b.tipo === 'destaque') return '<div class="destaque">' + md(b.texto) + '</div>';
  if(b.tipo === 'lista') return '<ul>' + b.itens.map(function(i){ return '<li>' + md(i) + '</li>'; }).join('') + '</ul>';
  if(b.tipo === 'passos') return '<ol class="passos">' + b.itens.map(function(i){ return '<li>' + md(i) + '</li>'; }).join('') + '</ol>';
  if(b.tipo === 'checklist') return '<div class="ferr"><b>' + esc(b.titulo) + '</b>' + (b.dica ? '<small>' + esc(b.dica) + '</small>' : '') + b.itens.map(function(i, n){ var k = id + '_' + n; return '<label class="chk"><input type="checkbox" data-chk="' + k + '"' + (E.chk[k] ? ' checked' : '') + '><span>' + md(i) + '</span></label>'; }).join('') + '</div>';
  if(b.tipo === 'cartoes') return '<div><b>' + esc(b.titulo) + '</b>' + b.itens.map(function(c){ return '<details class="cartao"><summary>' + esc(c.frente) + '</summary><div>' + md(c.verso) + '</div></details>'; }).join('') + '</div>';
  if(b.tipo === 'ferramenta') return '<div class="ferr" data-ferr="' + id + '"><b>' + esc(b.titulo) + '</b>' + (b.dica ? '<small>' + esc(b.dica) + '</small>' : '')
    + b.campos.map(function(c){ var k = id + '_' + c.id, v = E.campos[k] != null ? E.campos[k] : (c.exemplo || ''); return '<label>' + esc(c.rotulo) + (c.ajuda ? '<em>' + esc(c.ajuda) + '</em>' : '') + (c.linhas === 1 ? '<input data-campo="' + k + '" value="' + esc(v) + '">' : '<textarea data-campo="' + k + '">' + esc(v) + '</textarea>') + '</label>'; }).join('')
    + '<div class="saida" id="s_' + id + '"></div><div class="bts"><button class="bt" data-copiar="' + id + '">Copiar</button><button class="bt2" data-limpar="' + id + '">Limpar</button></div></div>';
  if(b.tipo === 'quiz') return '<div class="quiz" data-quiz="' + pi + '"><b>Teste rápido</b><small>Acerte ' + Math.ceil(b.perguntas.length * 0.66) + ' de ' + b.perguntas.length + ' para concluir esta parte.</small>' + b.perguntas.map(function(q, n){ return '<div class="qq" data-q="' + n + '"><p>' + esc(q.p) + '</p>' + q.o.map(function(o, i){ return '<button data-o="' + i + '">' + esc(o) + '</button>'; }).join('') + '<div class="ex"></div></div>'; }).join('') + '<div class="qres"></div></div>';
  return '';
}

function montar(){
  var h = '<div class="promessa"><b>No fim deste guia</b>' + md(D.promessa || '') + (D.para_quem ? '<p style="margin:6px 0 0;color:var(--suave);font-size:15px">Para quem: ' + esc(D.para_quem) + '</p>' : '') + '</div>';
  (D.partes || []).forEach(function(p, pi){
    h += '<section class="parte' + (E.partes[pi] ? ' ok' : '') + '" id="parte' + pi + '"><header><span>Parte ' + (pi + 1) + (p.minutos ? ' · ' + p.minutos + ' min' : '') + '</span><h2>' + esc(p.titulo) + '</h2></header>'
      + (p.blocos || []).map(function(b, bi){ return bloco(b, pi, bi); }).join('') + '<div class="feito">Parte concluída</div></section>';
  });
  if(D.fontes && D.fontes.length) h += '<section class="parte"><header><span>Como foi feito</span><h2>Fontes consultadas</h2></header><p style="color:var(--suave);font-size:15px">' + esc(D.metodo || 'Este guia junta o que serviços oficiais de emprego e educação de vários países recomendam, adaptado para ser aplicado hoje.') + '</p><ul class="fontes">' + D.fontes.map(function(f){ return '<li><b>' + esc(f.pais) + '</b> · ' + esc(f.org) + ': ' + esc(f.ideia) + '<br><a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.url) + '</a></li>'; }).join('') + '</ul></section>';
  h += '<div class="fim"><h2>' + esc(D.fim_titulo || 'Continue a treinar') + '</h2><p>' + esc(D.fim_texto || 'O Desafio do dia e o teste psicotécnico mantêm a sua mente pronta. Grátis, 5 minutos por dia.') + '</p><a class="a1" href="' + esc((D.fim_link || '/') + ((D.fim_link || '/').indexOf('?') >= 0 ? '&' : '?') + 'utm_source=guia&utm_campaign=' + (D.id || '')) + '">' + esc(D.fim_botao || 'Ir para o desafio de hoje') + '</a><button class="a2" id="fimPart">Partilhar este guia</button></div>';
  $('conteudo').innerHTML = h;
}

function saida(id){
  var f = document.querySelector('[data-ferr="' + id + '"]'); if(!f) return;
  var pi = +id.split('b')[0].slice(1), bi = +id.split('b')[1], b = D.partes[pi].blocos[bi], t = b.modelo;
  b.campos.forEach(function(c){ var v = (E.campos[id + '_' + c.id] != null ? E.campos[id + '_' + c.id] : (c.exemplo || '')).trim(); t = t.split('{' + c.id + '}').join(v || '[' + c.rotulo + ']'); });
  $('s_' + id).textContent = t;
}
function progresso(){
  var n = (D.partes || []).length, f = Object.keys(E.partes).filter(function(k){ return E.partes[k]; }).length;
  $('pBar').style.width = (n ? Math.round(f / n * 100) : 0) + '%';
  $('pTxt').textContent = f === n && n ? 'Guia concluído. Parabéns.' : f + ' de ' + n + ' partes concluídas';
}
function ligar(){
  document.querySelectorAll('[data-campo]').forEach(function(el){ el.addEventListener('input', function(){ E.campos[el.dataset.campo] = el.value; gravar(E); saida(el.dataset.campo.split('_')[0]); }); });
  document.querySelectorAll('[data-ferr]').forEach(function(f){ saida(f.dataset.ferr); });
  document.querySelectorAll('[data-copiar]').forEach(function(b){ b.onclick = function(){ var t = $('s_' + b.dataset.copiar).textContent; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ b.textContent = 'Copiado'; setTimeout(function(){ b.textContent = 'Copiar'; }, 1500); }).catch(function(){ prompt('Copie o texto:', t); }); medir('guia_copiou'); }; });
  document.querySelectorAll('[data-limpar]').forEach(function(b){ b.onclick = function(){ var id = b.dataset.limpar; document.querySelectorAll('[data-ferr="' + id + '"] [data-campo]').forEach(function(el){ el.value = ''; E.campos[el.dataset.campo] = ''; }); gravar(E); saida(id); }; });
  document.querySelectorAll('[data-chk]').forEach(function(c){ c.onchange = function(){ E.chk[c.dataset.chk] = c.checked; gravar(E); }; });
  document.querySelectorAll('[data-quiz]').forEach(function(qz){
    var pi = +qz.dataset.quiz, qs = D.partes[pi].blocos.filter(function(b){ return b.tipo === 'quiz'; })[0].perguntas, certas = 0, resp = 0;
    qz.querySelectorAll('.qq').forEach(function(qq){ var q = qs[+qq.dataset.q];
      qq.querySelectorAll('[data-o]').forEach(function(b){ b.onclick = function(){
        var i = +b.dataset.o; qq.querySelectorAll('[data-o]').forEach(function(x){ x.disabled = true; if(+x.dataset.o === q.c) x.classList.add('certa'); });
        if(i === q.c) certas++; else b.classList.add('errada'); resp++;
        qq.querySelector('.ex').textContent = (i === q.c ? 'Certo. ' : 'Resposta certa: ' + q.o[q.c] + '. ') + q.e;
        if(resp === qs.length){
          var ok = certas >= Math.ceil(qs.length * 0.66), r = qz.querySelector('.qres');
          r.textContent = certas + ' de ' + qs.length + (ok ? '. Parte concluída.' : '. Releia esta parte e tente de novo.');
          if(ok){ E.partes[pi] = 1; gravar(E); $('parte' + pi).classList.add('ok'); progresso(); medir('guia_parte_' + pi); }
          else { var bt = document.createElement('button'); bt.className = 'bt2'; bt.textContent = 'Tentar de novo'; bt.style.marginTop = '8px'; bt.onclick = function(){ montar(); ligar(); progresso(); $('parte' + pi).scrollIntoView(); }; r.appendChild(bt); }
        }
      }; });
    });
  });
  $('fimPart').onclick = function(){ var t = (D.partilha || D.titulo) + ' ' + location.origin + location.pathname + '?utm_source=partilha'; if(navigator.share) navigator.share({ text:t }).catch(function(){}); else window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank', 'noopener'); medir('guia_partilhou'); };
}
montar(); ligar(); progresso(); medir('guia_abriu');
})();
</script>
</body>
</html>
